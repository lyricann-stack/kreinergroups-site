<style>
:root {

}
@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] {

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#brand { pointer-events: auto; padding: 10px 14px 11px; display: grid; gap: 2px; min-width: 0; }
#brand .eyebrow { font-family: var(--f-sign); font-weight: 600; letter-spacing: 0.12em; font-size: 12px; color: var(--ink-2); text-transform: uppercase; }
#brand h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
#brand .stage { font-size: 12px; color: var(--ink-2); }
#brand .stage b { display: inline-block; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 4px; padding: 0 6px; margin-right: 6px; font-family: var(--f-sign); letter-spacing: 0.04em; }
#tools { pointer-events: auto; display: flex; gap: 8px; }
.tbtn { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
.tbtn svg { width: 18px; height: 18px; }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); }
#map { position: absolute; left: var(--gut); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 300px; padding: 8px; pointer-events: auto; }
#map canvas { display: block; width: 100%; height: auto; border-radius: 7px; cursor: crosshair; }
#map .cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); padding: 2px 2px 6px; }
#map .cap span:last-child { font-family: var(--f-sign); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
#map.big { left: 50%; top: 50%; bottom: auto; transform: translate(-50%, -50%); width: min(92vw, 980px); z-index: 30; }
#card { position: absolute; right: var(--gut); top: calc(84px + env(safe-area-inset-top, 0px)); width: 370px; max-height: calc(100% - 110px); display: flex; flex-direction: column; overflow: hidden; pointer-events: auto; }
#card[hidden] { display: none !important; }
#card header { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 14px 14px 10px; }
#card .num { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-sign); font-weight: 700; font-size: 24px; }
#card h2 { margin: 0; font-size: 19px; line-height: 1.3; text-wrap: balance; }
#card .en { font-family: var(--f-sign); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; color: var(--ink-2); }
#card .x { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
#card .x:hover { background: var(--line); }
#card .body { padding: 0 14px 14px; overflow-y: auto; min-height: 0; display: grid; gap: 12px; }
#card p { margin: 0; line-height: 1.7; font-size: 15px; max-width: 34em; }
#card .media { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
#card .media button { border: 0; padding: 0; border-radius: 7px; overflow: hidden; aspect-ratio: 4 / 3; background: var(--line); position: relative; }
#card .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
#card .media .play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.28); color: #fff; font-size: 12px; font-weight: 700; gap: 2px; align-content: center; }
#card .media .play svg { width: 26px; height: 26px; }
#card .meta { font-size: 12px; color: var(--ink-2); }
#card .steps .lbl { font-size: 12px; color: var(--ink-2); margin-bottom: 6px; letter-spacing: 0.04em; }
#card .steps ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
#card .steps li { font-size: 13.5px; line-height: 1.45; padding: 5px 9px; border-radius: 7px; color: var(--ink-2); display: flex; gap: 8px; }
#card .steps li::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 7px; background: var(--line); }
#card .steps li.on { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); font-weight: 600; }
#card .steps li.on::before { background: var(--route); }
#zoom { position: absolute; right: var(--gut); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; overflow: hidden; pointer-events: auto; }
#zoom button { width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; }
#zoom button + button { border-top: 1px solid var(--line); }
#zoom button:hover { background: var(--line); }
#zoom svg { width: 18px; height: 18px; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); background: var(--scrim); padding: var(--gut); z-index: 40; }
.overlay[hidden] { display: none !important; }
#start .panel { width: 100%; max-width: 560px; min-width: 0; padding: 24px 24px 20px; display: grid; gap: 14px; max-height: calc(100% - 32px); overflow-y: auto; }
#start .eyebrow { font-family: var(--f-sign); font-weight: 600; letter-spacing: 0.14em; font-size: 13px; color: var(--ink-2); text-transform: uppercase; }
#start h2 { margin: 0; font-size: 28px; line-height: 1.2; }
#start p { margin: 0; line-height: 1.75; font-size: 15px; color: var(--ink); }
#start .keys { display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); padding: 12px 14px; border-radius: 10px; background: var(--line); }
#start kbd { font-family: var(--f-sign); font-weight: 600; font-size: 13px; border: 1px solid var(--ink-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); }
#start .row { display: flex; gap: 10px; flex-wrap: wrap; }
#start .row button { flex: 1 1 180px; min-height: 48px; border-radius: 10px; font-weight: 700; font-size: 16px; border: 1px solid var(--line); background: transparent; }
#start .row button.go { background: var(--route); color: #fff; border-color: transparent; }
#start .row button:disabled { opacity: 0.45; cursor: progress; }
#start .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
#start .bar i { display: block; height: 100%; width: 0%; background: var(--route); transition: width 0.2s; }
#start .fine { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; }
#start details { font-size: 12.5px; color: var(--ink-2); line-height: 1.65; }
#start details summary { cursor: pointer; color: var(--ink); font-weight: 500; }
#start details ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; }
#lb { background: rgba(10, 12, 14, 0.92); }
#lb figure { margin: 0; display: grid; gap: 10px; justify-items: center; width: min(1200px, 100%); }
#lb img, #lb video { max-width: 100%; max-height: calc(100vh - 140px); border-radius: 8px; display: block; background: #000; }
#lb figcaption { color: #e9ecee; font-size: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
#lb figcaption span { font-family: var(--f-sign); letter-spacing: 0.06em; color: #b9c1c7; font-variant-numeric: tabular-nums; }
#lb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.14); color: #fff; display: grid; place-items: center; }
#lb .nav svg { width: 22px; height: 22px; }
#lb .prev { left: var(--gut); } #lb .next { right: var(--gut); }
#lb .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: var(--gut); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.14); color: #fff; display: grid; place-items: center; }
#toast { position: absolute; left: 50%; top: calc(84px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 9px 14px; font-size: 14px; pointer-events: none; transition: opacity 0.3s; z-index: 20; max-width: calc(100% - 32px); }
#toast[hidden] { display: block !important; opacity: 0; }
#hint { position: absolute; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 8px 14px; font-size: 14px; pointer-events: none; white-space: nowrap; }
@media (max-width: 760px) {
  #brand h1 { font-size: 16px; }
  #brand .eyebrow, #brand .date { display: none; }
  #start .panel { padding: 20px 18px 16px; }
  #start h2 { font-size: 24px; }
  .tbtn .lbl { display: none; }
  #map { display: none; }
  #map.big { display: block; }
  #card { left: var(--gut); right: var(--gut); width: auto; top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 44%; }
  #hint { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #zoom { bottom: auto; top: calc(76px + env(safe-area-inset-top, 0px)); }
  body.carded #hint { display: none; }
  #card .media { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 440px) { 
  #brand { padding: 8px 11px 9px; }
  #brand h1 { font-size: 14px; white-space: nowrap; }
  #brand .stage { font-size: 11px; }
}
@media (min-width: 761px) { #mapBtn { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    </div>
  </div>

  <div id="map" class="panel">

  </div>

  <aside id="card" class="panel" hidden aria-live="polite">
    <header>
      <div class="num" id="cNum">1</div>
      <div><h2 id="cTitle"></h2><div class="en" id="cEn"></div></div>
      <button class="x" id="cClose" type="button" aria-label="关闭站点卡片"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

      <div class="meta" id="cMeta"></div>
    </div>
  </aside>

    <button type="button" id="zOut" aria-label="拉远"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  </div>
  <div id="hint" class="panel" hidden></div>
  <div id="toast" class="panel" hidden></div>

      <h2 id="sTitle">胜昌工厂 3D 导览</h2>
      <p>照平面图 1:1 建的厂区（约 16,000 m²）。点地板就会走过去，像 Google 街景一样；黄色标记是浴缸制程的 12 个地点，走近会看到现场照片和视频。</p>
      <div class="keys" id="sKeys"></div>
      <div class="bar" aria-hidden="true"><i id="sBar"></i></div>
      <div class="row">
        <button type="button" class="go" id="sWalk" disabled>进入工厂</button>
      </div>
      <div class="fine" id="sStatus">正在依平面图搭建厂房…</div>
      
    </div>
  </div>

  <div id="lb" class="overlay" hidden role="dialog" aria-label="实拍照片">
    <figure>
      <div id="lbMedia"></div>
      <figcaption><b id="lbTitle"></b><span id="lbCount"></span></figcaption>
    </figure>
    <button class="nav prev" id="lbPrev" type="button" aria-label="上一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" id="lbNext" type="button" aria-label="下一张"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="close" id="lbClose" type="button" aria-label="关闭"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
